[project]
name = "nfa-studio"
version = "0.1.0"
description = "Natural-language-to-automaton workbench with verified ε-NFAs."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Set notation from the spec is intentional in docstrings and messages.
allowed-confusables = ["∪", "⋃", "∖", "×", "′", "–"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
